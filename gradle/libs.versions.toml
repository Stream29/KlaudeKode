# Version catalog is a central place for you to declare and version dependencies
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
kotlin = "2.3.0"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
# Keep compat until Koog public APIs stop depending on kotlinx.datetime.Instant/Clock ABI.
kotlinxDatetime = "0.7.1-0.6.x-compat"
koog = "0.6.2"
ktor = "3.3.2"
netty = "4.1.126.Final"
ivy = "2.5.3"
kaml = "0.104.0"
compose = "1.11.0-alpha02"
androidx-lifecycle = "2.10.0"
jetbrainsLifecycle = "2.10.0-alpha08"
jetbrainsNavigation3 = "1.1.0-alpha02"
composeMaterial3 = "1.11.0-alpha02"
composeMaterialIconsExtended = "1.7.3"
jsoup = "1.17.2"
commonmark = "0.27.1"
javafx = "21.0.8"
markdownRenderer = "0.39.2"
kotlinxCollectionsImmutable = "0.4.0"
kotlinxSerializationCsv = "0.0.23"
koin = "4.1.0"
composeRemoteLayout = "0.2.0-alpha01"
oidc = "0.16.5"

[libraries]
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }

kotlinxCoroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinxCollectionsImmutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
serializationCsv = { module = "app.softwork:kotlinx-serialization-csv", version.ref = "kotlinxSerializationCsv" }

androidxViewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidxViewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidxLifecycleRuntimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
jetbrainsLifecycleViewmodelNavigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "jetbrainsLifecycle" }
jetbrainsNavigation3Ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "jetbrainsNavigation3" }
jetbrainsComposeMaterial3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
jetbrainsComposeMaterialIconsExtended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "composeMaterialIconsExtended" }
koinCore = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koinCompose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }

# Koog framework
koogAgents = { module = "ai.koog:koog-agents", version.ref = "koog" }
koogAgentsTest = { module = "ai.koog:agents-test", version.ref = "koog" }
koogAgentsFeaturesAcp = { module = "ai.koog:agents-features-acp", version.ref = "koog" }
koogAgentsMcp = { module = "ai.koog:agents-mcp", version.ref = "koog" }
koogAnthropicClient = { module = "ai.koog:prompt-executor-anthropic-client", version.ref = "koog" }
koogOpenAiClient = { module = "ai.koog:prompt-executor-openai-client", version.ref = "koog" }
koogGoogleClient = { module = "ai.koog:prompt-executor-google-client", version.ref = "koog" }
koogDeepseekClient = { module = "ai.koog:prompt-executor-deepseek-client", version.ref = "koog" }
ktorClientCio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktorServerCore = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktorServerCio = { module = "io.ktor:ktor-server-cio-jvm", version.ref = "ktor" }

# Kotlin scripting
kotlinScriptingJvmHost = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm-host", version.ref = "kotlin" }
kotlinMainKts = { module = "org.jetbrains.kotlin:kotlin-main-kts", version.ref = "kotlin" }
apacheIvy = { module = "org.apache.ivy:ivy", version.ref = "ivy" }

# Testing
kotlinTest = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# HTML parsing for web fetch
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmarkExtAutolink = { module = "org.commonmark:commonmark-ext-autolink", version.ref = "commonmark" }
commonmarkExtGfmTables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmarkExtGfmStrikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
commonmarkExtTaskListItems = { module = "org.commonmark:commonmark-ext-task-list-items", version.ref = "commonmark" }
javafxBase = { module = "org.openjfx:javafx-base", version.ref = "javafx" }
javafxGraphics = { module = "org.openjfx:javafx-graphics", version.ref = "javafx" }
javafxControls = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
javafxMedia = { module = "org.openjfx:javafx-media", version.ref = "javafx" }
javafxWeb = { module = "org.openjfx:javafx-web", version.ref = "javafx" }
javafxSwing = { module = "org.openjfx:javafx-swing", version.ref = "javafx" }
markdownRendererM3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
composeRemoteLayoutJvm = { module = "io.github.utsmannn:compose-remote-layout-jvm", version.ref = "composeRemoteLayout" }
oidcCore = { module = "io.github.kalinjul.kotlin.multiplatform:oidc-core", version.ref = "oidc" }

[bundles]
koog = [
    "koogAgents",
    "koogAgentsFeaturesAcp",
    "koogAgentsMcp",
    "koogAnthropicClient",
    "koogOpenAiClient",
    "koogGoogleClient",
    "koogDeepseekClient",
    "ktorClientCio"
]
kotlinScripting = [
    "kotlinScriptingJvmHost",
    "kotlinMainKts",
    "apacheIvy"
]
compose = [
    "androidxViewmodel",
    "androidxViewmodelCompose",
    "androidxLifecycleRuntimeCompose",
    "kotlinxCoroutinesSwing"
]
serialization = [
    "kaml",
    "kotlinxSerializationJson"
]
testing = ["kotlinTest", "kotlinxCoroutinesTest"]

[plugins]
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinPluginCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
